<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Resume</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
            background: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            max-width: 800px;
            margin: auto;
            border-radius: 10px;
        }
        h1, h2 {
            color: #333;
        }
        .section {
            margin-bottom: 20px;
        }
        a {
            color: #0077cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Name</h1>
        <p>Email: your@email.com | LinkedIn: <a href="#">Profile</a></p>

        <div class="section">
            <h2>Summary</h2>
            <p>Brief description about yourself.</p>
        </div>

        <div class="section">
            <h2>Experience</h2>
            <p><strong>Job Title</strong> - Company</p>
            <p>Describe what you did.</p>
        </div>

        <div class="section">
            <h2>Projects</h2>
            <p>Project name - short description</p>
        </div>

        <div class="section">
            <h2>Skills</h2>
            <p>HTML, CSS, JavaScript, etc.</p>
        </div>
    </div>
</body>
</html>
